name: REx Android v1.3 weighted keyword fusion APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout REx
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python 3.11 for Chinese/English phoneme generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Android SDK 36 (preinstalled)
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare sherpa KWS, Silero VAD and pinned CAM++ speaker model
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "pypinyin==0.55.0"
          python tools/prepare_sherpa_android.py
      - name: Download openWakeWord frozen TFLite feature models
        shell: bash
        run: python tools/prepare_openwakeword_features.py
      - name: Offline speech regression tests
        run: bash tests/run_offline_tests.sh
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: REX-v1.3-weighted-fusion-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
