plugins { id 'com.android.application' }

android {
    namespace 'com.rex.remote'
    compileSdk 36
    defaultConfig {
        applicationId 'com.rex.remote'
        minSdk 29
        targetSdk 36
        versionCode 13
        versionName '1.2.3-voice-diagnostics'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pinned official sherpa-onnx JVM API; GitHub Actions prepares this .jar
    // and its matching arm64 JNI binaries before Gradle runs.
    implementation files('libs/sherpa-onnx-jvm-2.0.2.jar')
    // Separate LiteRT Java frontend avoids native ONNX Runtime conflict with sherpa.
    implementation 'com.google.ai.edge.litert:litert:1.4.2'
}

